<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="strikeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="radarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="512" height="512" rx="108" fill="url(#oceanBg)"/>

  <!-- Radar Pulse Rings -->
  <circle cx="256" cy="270" r="180" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6,8"/>
  <circle cx="256" cy="270" r="130" fill="url(#radarPulse)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="256" cy="270" r="80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Gauge Arc Tick Marks -->
  <path d="M 120 300 A 150 150 0 1 1 392 300" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
  <path d="M 120 300 A 150 150 0 0 1 340 160" fill="none" stroke="url(#strikeGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Stylized Striking Fish / Hook Emblem -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Strike Hook -->
    <path d="M 10 -90 L 10 30 C 10 65 40 85 75 75 C 105 65 115 35 110 15 L 95 30 C 98 42 90 55 75 58 C 50 63 32 48 32 25 L 32 -90 Z" fill="#38bdf8" filter="url(#glow)"/>
    <!-- Fish Silhouette Arc -->
    <path d="M -75 -40 C -40 -85 30 -85 70 -50 C 45 -40 20 -25 0 0 C -35 -20 -60 -25 -75 -40 Z" fill="url(#strikeGrad)"/>
    <!-- Dorsal Fin / Strike Indicator -->
    <polygon points="0,-72 35,-105 45,-70" fill="#10b981"/>
    <!-- Tail Fin -->
    <polygon points="-75,-40 -115,-65 -100,-35 -120,-10 -75,-30" fill="#0284c7"/>
    <!-- Eye / Hot Spot -->
    <circle cx="48" cy="-56" r="5" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- High-Precision Needle Pivot -->
  <circle cx="256" cy="285" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="256" cy="285" r="5" fill="#f59e0b"/>
</svg>
