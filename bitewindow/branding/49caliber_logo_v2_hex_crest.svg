<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#0b1f3a" />
      <stop offset="100%" stop-color="#051326" />
    </linearGradient>
    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .big49 { font: 900 250px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; letter-spacing: -8px; fill: #ffffff; }
      .tag { font: 800 44px 'Consolas', monospace; letter-spacing: 10px; fill: #34d399; }
    </style>
  </defs>

  <rect width="1024" height="1024" rx="200" fill="url(#bg2)" />

  <!-- Outer Tactical Hexagon -->
  <polygon points="512,64 900,288 900,736 512,960 124,736 124,288" fill="#061326" stroke="url(#hexStroke)" stroke-width="18" filter="url(#glow2)" />

  <!-- Inner Phased-Array Rings -->
  <circle cx="512" cy="480" r="310" fill="none" stroke="#0284c7" stroke-width="5" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="512" cy="480" r="235" fill="none" stroke="#10b981" stroke-width="5" opacity="0.55" />

  <!-- Mesh Triangle Behind Core -->
  <polygon points="512,175 785,645 239,645" fill="#0ea5e9" fill-opacity="0.14" stroke="#38bdf8" stroke-width="8" stroke-dasharray="26 12" />

  <!-- 3Glowing Mesh Nodes -->
  <circle cx="512" cy="175" r="24" fill="#10b981" filter="url(#glow2)" />
  <circle cx="785" cy="645" r="24" fill="#00f2fe" filter="url(#glow2)" />
  <circle cx="239" cy="645" r="24" fill="#f59e0b" filter="url(#glow2)" />

  <!-- Center Core Circle + 49 -->
  <circle cx="512" cy="480" r="168" fill="#040d1c" stroke="#00f2fe" stroke-width="10" filter="url(#glow2)" />
  <text x="512" y="566" text-anchor="middle" class="big49">49</text>

  <!-- Bottom Label Inside Hex -->
  <text x="512" y="805" text-anchor="middle" class="tag">CALIBER LABS</text>
</svg>