<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Core Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ring Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Dark Slate Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Sub-grid Background Pattern -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="700" y1="0" x2="700" y2="800" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
  </g>

  <!-- LOGO MARK CENTERED AT (400, 350) -->
  <g transform="translate(400, 340)">
    
    <!-- Outer RF Propagation Ring 4 (Dashed Wave) -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 12" opacity="0.35" filter="url(#cyanGlow)"/>
    
    <!-- Outer RF Propagation Ring 3 (Segmented Radar Sweep) -->
    <circle cx="0" cy="0" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="80 15 30 15" opacity="0.65" />
    
    <!-- Outer RF Propagation Ring 2 (Pulse Ring) -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="120 20" opacity="0.8" filter="url(#cyanGlow)"/>
    
    <!-- Main Perimeter Circle (Solid Core) -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#00F0FF" stroke-width="4" filter="url(#cyanGlow)"/>

    <!-- Right-Angle Reticle Bracket Top-Right -->
    <path d="M 40,-120 L 120,-120 L 120,-40" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="square" filter="url(#intenseGlow)" />
    <!-- Right-Angle Reticle Bracket Bottom-Left -->
    <path d="M -40,120 L -120,120 L -120,40" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="square" filter="url(#intenseGlow)" />
    
    <!-- Reticle Corner Accent Dots -->
    <circle cx="120" cy="-120" r="5" fill="#FFFFFF" filter="url(#intenseGlow)"/>
    <circle cx="-120" cy="120" r="5" fill="#FFFFFF" filter="url(#intenseGlow)"/>

    <!-- Major Crosshairs -->
    <!-- Horizontal Crosshair -->
    <line x1="-250" y1="0" x2="-125" y2="0" stroke="#00F0FF" stroke-width="2" opacity="0.7"/>
    <line x1="-85" y1="0" x2="-25" y2="0" stroke="#00F0FF" stroke-width="3" filter="url(#cyanGlow)"/>
    <line x1="25" y1="0" x2="85" y2="0" stroke="#00F0FF" stroke-width="3" filter="url(#cyanGlow)"/>
    <line x1="125" y1="0" x2="250" y2="0" stroke="#00F0FF" stroke-width="2" opacity="0.7"/>

    <!-- Vertical Crosshair -->
    <line x1="0" y1="-250" x2="0" y2="-125" stroke="#00F0FF" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="-85" x2="0" y2="-25" stroke="#00F0FF" stroke-width="3" filter="url(#cyanGlow)"/>
    <line x1="0" y1="25" x2="0" y2="85" stroke="#00F0FF" stroke-width="3" filter="url(#cyanGlow)"/>
    <line x1="0" y1="125" x2="0" y2="250" stroke="#00F0FF" stroke-width="2" opacity="0.7"/>

    <!-- Diagonal Degree Ticks -->
    <line x1="-74" y1="-74" x2="-64" y2="-64" stroke="#38BDF8" stroke-width="2"/>
    <line x1="74" y1="-74" x2="64" y2="-64" stroke="#38BDF8" stroke-width="2"/>
    <line x1="-74" y1="74" x2="-64" y2="64" stroke="#38BDF8" stroke-width="2"/>
    <line x1="74" y1="74" x2="64" y2="64" stroke="#38BDF8" stroke-width="2"/>

    <!-- Inner Core Target Circle -->
    <circle cx="0" cy="0" r="45" fill="#0F172A" stroke="#00F0FF" stroke-width="3" filter="url(#cyanGlow)"/>
    <circle cx="0" cy="0" r="16" fill="#00F0FF" filter="url(#intenseGlow)"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    
    <!-- Frequency Signal Arc Highlights -->
    <path d="M -170,0 A 170 170 0 0 1 0,-170" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0,170 A 170 170 0 0 1 170,0" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g text-anchor="middle">
    <!-- Main Title: 49CALIBER -->
    <text x="400" y="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" letter-spacing="12" fill="#FFFFFF">
      49CALIBER
    </text>

    <!-- Subtitle: LABS -->
    <text x="400" y="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="22" fill="#00F0FF" filter="url(#cyanGlow)">
      LABS
    </text>

    <!-- Tagline: COMMUNICATIONS RESEARCH &amp; RF SYSTEMS -->
    <text x="400" y="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" letter-spacing="6" fill="#64748B">
      RF TECHNOLOGY &amp; COMMUNICATIONS RESEARCH
    </text>
  </g>
</svg>
