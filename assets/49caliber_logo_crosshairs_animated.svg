<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#091931" />
      <stop offset="100%" stop-color="#041022" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <pattern id="tacGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-opacity="0.35" />
    </pattern>
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .brand-main { font: 800 58px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; letter-spacing: 3px; fill: #ffffff; }
      .brand-sub { font: 700 22px 'Consolas', 'Courier New', monospace; letter-spacing: 3px; fill: #00f2fe; }
      .node-lbl { font: 700 20px 'Consolas', 'Courier New', monospace; }
      @keyframes pulse1 { 0% { r: 44px; opacity: 0.9; stroke-width: 4px; } 100% { r: 335px; opacity: 0; stroke-width: 1px; } }
      @keyframes pulse2 { 0% { r: 44px; opacity: 0.7; stroke-width: 3.5px; } 100% { r: 280px; opacity: 0; stroke-width: 1px; } }
      @keyframes dashFlow { to { stroke-dashoffset: -140; } }
      .pulse-a { animation: pulse1 4.2s cubic-bezier(0.1, 0.6, 0.3, 1) infinite; }
      .pulse-b { animation: pulse2 4.2s cubic-bezier(0.1, 0.6, 0.3, 1) 2.1s infinite; }
      .mesh-chord { stroke-dasharray: 18 9; animation: dashFlow 5s linear infinite; }
    </style>
  </defs>

  <!-- Background & Outer Frame -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />
  <rect width="1024" height="1024" fill="url(#tacGrid)" />
  <rect x="20" y="20" width="984" height="984" fill="none" stroke="#00f2fe" stroke-width="12" stroke-opacity="0.9" />
  <rect x="38" y="38" width="948" height="948" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.6" />
  <circle cx="512" cy="430" r="340" fill="url(#coreGlow)" />

  <!-- Phased-Array Radar & Precision Crosshairs Centered at (512, 430) -->
  <g transform="translate(512, 430)">
    <!-- Concentric Isobar Rings -->
    <circle cx="0" cy="0" r="335" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-dasharray="10 8" />
    <circle cx="0" cy="0" r="265" fill="none" stroke="#0284c7" stroke-opacity="0.55" stroke-width="3.5" />
    <circle cx="0" cy="0" r="195" fill="none" stroke="#00f2fe" stroke-opacity="0.65" stroke-width="3.5" />
    <circle cx="0" cy="0" r="125" fill="none" stroke="#10b981" stroke-opacity="0.7" stroke-width="3.5" />

    <!-- Animated Expanding LoRa RF Pulse Rings -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#00f2fe" class="pulse-a" />
    <circle cx="0" cy="0" r="44" fill="none" stroke="#10b981" class="pulse-b" />

    <!-- Secondary Mesh Triangle -->
    <polygon points="-155,-145 210,-70 50,210" fill="#10b981" fill-opacity="0.11" stroke="#10b981" stroke-width="3" stroke-opacity="0.7" />

    <!-- Primary 915 MHz Phased-Array Triangle -->
    <polygon points="0,-220 195,120 -180,110" fill="#0ea5e9" fill-opacity="0.14" stroke="#38bdf8" stroke-width="4.5" class="mesh-chord" />

    <!-- Full Precision Crosshairs & Mil-Dot Rangefinder Ticks -->
    <line x1="-355" y1="0" x2="355" y2="0" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.75" />
    <line x1="0" y1="-355" x2="0" y2="355" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.75" />

    <!-- Horizontal Ticks -->
    <g stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.85">
      <line x1="-330" y1="-14" x2="-330" y2="14" />
      <line x1="-275" y1="-8" x2="-275" y2="8" />
      <line x1="-220" y1="-14" x2="-220" y2="14" />
      <line x1="-165" y1="-8" x2="-165" y2="8" />
      <line x1="-110" y1="-14" x2="-110" y2="14" />
      <line x1="-55" y1="-8" x2="-55" y2="8" />
      <line x1="55" y1="-8" x2="55" y2="8" />
      <line x1="110" y1="-14" x2="110" y2="14" />
      <line x1="165" y1="-8" x2="165" y2="8" />
      <line x1="220" y1="-14" x2="220" y2="14" />
      <line x1="275" y1="-8" x2="275" y2="8" />
      <line x1="330" y1="-14" x2="330" y2="14" />
      <!-- Vertical Ticks -->
      <line x1="-14" y1="-330" x2="14" y2="-330" />
      <line x1="-8" y1="-275" x2="8" y2="-275" />
      <line x1="-14" y1="-220" x2="14" y2="-220" />
      <line x1="-8" y1="-165" x2="8" y2="-165" />
      <line x1="-14" y1="-110" x2="14" y2="-110" />
      <line x1="-8" y1="-55" x2="8" y2="-55" />
      <line x1="-8" y1="55" x2="8" y2="55" />
      <line x1="-14" y1="110" x2="14" y2="110" />
      <line x1="-8" y1="165" x2="8" y2="165" />
      <line x1="-14" y1="220" x2="14" y2="220" />
      <line x1="-8" y1="275" x2="8" y2="275" />
      <line x1="-14" y1="330" x2="14" y2="330" />
    </g>

    <!-- Center Transceiver Reticle (Unobstructed Crosshair Bullseye) -->
    <circle cx="0" cy="0" r="44" fill="#071529" fill-opacity="0.75" stroke="#00f2fe" stroke-width="4.5" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#10b981" stroke-width="2" />
    <line x1="-56" y1="0" x2="56" y2="0" stroke="#00f2fe" stroke-width="2.5" />
    <line x1="0" y1="-56" x2="0" y2="56" stroke="#00f2fe" stroke-width="2.5" />
    <circle cx="0" cy="0" r="8" fill="#00f2fe" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />

    <!-- 3 Vertex Transceiver Nodes -->
    <circle cx="0" cy="-220" r="16" fill="#10b981" filter="url(#neonGlow)" />
    <circle cx="0" cy="-220" r="6" fill="#ffffff" />
    <text x="24" y="-213" class="node-lbl" fill="#10b981">NODE_0xA1</text>

    <circle cx="195" cy="120" r="16" fill="#00f2fe" filter="url(#neonGlow)" />
    <circle cx="195" cy="120" r="6" fill="#ffffff" />
    <text x="218" y="127" class="node-lbl" fill="#00f2fe">MULE_0xB2</text>

    <circle cx="-180" cy="110" r="16" fill="#f59e0b" filter="url(#neonGlow)" />
    <circle cx="-180" cy="110" r="6" fill="#ffffff" />
    <text x="-315" y="117" class="node-lbl" fill="#f59e0b">SAR_PEER</text>
  </g>

  <!-- Bottom Corporate Wordmark -->
  <text x="512" y="868" text-anchor="middle" class="brand-main">49CALIBER LABS</text>
  <text x="512" y="925" text-anchor="middle" class="brand-sub">915 MHz RF TELEMETRY  •  CALIFORNIA</text>
</svg>
