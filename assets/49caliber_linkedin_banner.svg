    <text x="240" y="60" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2,880' RIM SOLAR RELAY</text>

    <circle cx="80" cy="255" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <text x="80" y="278" fill="#7dd3fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TRAILHEAD GATEWAY</text>

    <circle cx="375" cy="220" r="8" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
    <text x="375" y="243" fill="#a5f3fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">GORGE NODE (440')</text>
  </g>

  <!-- Typography & Brand Identity (Center-Left, Clear of LinkedIn Bottom-Left Avatar Overlap) -->
  <g transform="translate(340, 82)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="485" height="28" rx="14" fill="#0c243c" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="16" y="18" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1.2">
