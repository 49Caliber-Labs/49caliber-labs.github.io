    <!-- Main Corporate Title -->
    <text x="0" y="84" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.8">
      49CALIBER LABS, INC.
    </text>

    <!-- Technical Subtitle -->
    <text x="0" y="124" fill="url(#cyanEmerald)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700">
      Free-Payload Sub-GHz LoRa Mesh Telemetry &amp; Offline Backcountry Intelligence
    </text>

    <!-- Domain & Capability Pillars -->
    <text x="0" y="166" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="600">
      Hiker / MTB / Angler Mesh (MeshMule-Core)  •  Remote Park Watersheds (∇P)  •  Foothill Ag Frost Mesh  •  GPS-Denied SAR R&amp;D
    </text>

    <!-- Bottom URL & Repo Bar -->
    <rect x="0" y="192" width="660" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="215" fill="#e2e8f0" font-family="monospace" font-size="13.5" font-weight="bold">
      https://49caliber-labs.github.io   |   github.com/49Caliber-Labs/MeshMule-core
    </text>
  </g>
</svg>
