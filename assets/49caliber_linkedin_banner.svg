<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#09172a"/>
      <stop offset="100%" stop-color="#071222"/>
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="reticleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050d1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Slate Topographic Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)"/>

  <!-- Subtle UTM Coordinate Graticule Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="66" x2="1584" y2="66"/>
    <line x1="0" y1="132" x2="1584" y2="132"/>
    <line x1="0" y1="198" x2="1584" y2="198"/>
    <line x1="0" y1="264" x2="1584" y2="264"/>
    <line x1="0" y1="330" x2="1584" y2="330"/>
    <line x1="198" y1="0" x2="198" y2="396"/>
    <line x1="396" y1="0" x2="396" y2="396"/>
    <line x1="594" y1="0" x2="594" y2="396"/>
    <line x1="792" y1="0" x2="792" y2="396"/>
    <line x1="990" y1="0" x2="990" y2="396"/>
    <line x1="1188" y1="0" x2="1188" y2="396"/>
    <line x1="1386" y1="0" x2="1386" y2="396"/>
  </g>

  <!-- Topographic Canyon Contour Curves (Left to Right) -->
  <g fill="none">
    <path d="M 0,340 Q 280,290 540,320 T 1080,250 T 1584,290" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1.2"/>
    <path d="M 0,305 Q 300,245 570,280 T 1100,205 T 1584,245" stroke="#38bdf8" stroke-opacity="0.24" stroke-width="1.6"/>
    <path d="M 0,265 Q 320,195 600,235 T 1120,155 T 1584,195" stroke="#10b981" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="8 5"/>
    <path d="M 0,110 Q 360,165 660,115 T 1180,95 T 1584,125" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.2"/>
  </g>

  <!-- Multi-Hop Canyon-to-Rim Mesh Telemetry Topology (Right Side) -->
  <g transform="translate(1050, 30)">
    <circle cx="240" cy="168" r="165" fill="url(#reticleGlow)"/>
    <!-- Precision Crosshair Reticle -->
    <circle cx="240" cy="168" r="128" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="240" cy="168" r="88" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="6 4"/>
    <circle cx="240" cy="168" r="42" fill="none" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.8"/>
    <line x1="92" y1="168" x2="388" y2="168" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2"/>
    <line x1="240" y1="20" x2="240" y2="316" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="240" cy="168" r="5" fill="#38bdf8"/>

    <!-- Mesh Relay Links -->
    <line x1="80" y1="255" x2="240" y2="80" stroke="#10b981" stroke-width="2.2" stroke-dasharray="7 4"/>
    <line x1="240" y1="80" x2="375" y2="220" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="7 4"/>
    <line x1="80" y1="255" x2="240" y2="168" stroke="#06b6d4" stroke-opacity="0.65" stroke-width="1.6"/>
    <line x1="240" y1="168" x2="375" y2="220" stroke="#06b6d4" stroke-opacity="0.65" stroke-width="1.6"/>

